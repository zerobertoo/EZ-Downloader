name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install dependencies
        run: npm ci

      - name: Create placeholder bundled binaries
        # tauri-build's build.rs requires bundle.resources (resources/bin) to
        # exist at compile time. CI doesn't need real yt-dlp/ffmpeg binaries
        # to type-check or run unit tests, so empty placeholders are enough.
        run: |
          mkdir -p resources/bin/linux
          touch resources/bin/linux/yt-dlp resources/bin/linux/ffmpeg
          chmod +x resources/bin/linux/yt-dlp resources/bin/linux/ffmpeg

      - name: Type-check frontend
        run: npx tsc --noEmit

      - name: Build frontend
        run: npx vite build

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Rust check
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Rust fmt
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Rust clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
