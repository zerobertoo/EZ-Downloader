name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Um push novo cancela a execução anterior da mesma branch/PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Sem símbolos de depuração o build de teste fica bem menor e mais rápido,
  # e o cache do Rust deixa de passar de 1 GB.
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # Chave e limpeza automáticas: reaproveita o cache anterior quando o
      # Cargo.lock muda e descarta o que não foi usado, em vez de criar um
      # cache novo de ~1 GB a cada mudança.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux system dependencies
        run: |
          # O repositório do Google Chrome vem pré-configurado na imagem do
          # runner e não é usado no build; removê-lo evita falhas de
          # "Hash Sum mismatch" quando o mirror deles está fora de sincronia.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install dependencies
        run: npm ci

      # Verificações baratas primeiro: falham em segundos, antes dos testes lentos.
      - name: Rust fmt
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Type-check frontend
        run: npx tsc --noEmit

      - name: Create placeholder bundled binaries
        # tauri-build's build.rs requires bundle.resources (resources/bin) to
        # exist at compile time. CI doesn't need real yt-dlp/ffmpeg binaries
        # to type-check or run unit tests, so empty placeholders are enough.
        run: |
          mkdir -p resources/bin/linux
          touch resources/bin/linux/yt-dlp resources/bin/linux/ffmpeg
          chmod +x resources/bin/linux/yt-dlp resources/bin/linux/ffmpeg

      - name: Build frontend
        run: npx vite build

      # O clippy já compila e checa todos os alvos, então um `cargo check`
      # separado só repetiria o trabalho.
      - name: Rust clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
